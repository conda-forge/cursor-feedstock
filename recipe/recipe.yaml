schema_version: 1

context:
  version: "1.3.6"

package:
  name: cursor
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cursor/cursor-${{ version }}.tar.gz
  sha256: ff3586de5a8e9367b689b31092d3f681b03efc92fdcf10aea538778e80f9b67a

build:
  noarch: python
  number: 0
  python:
    entry_points:
      - cursor_hide = cursor:hide
      - cursor_show = cursor:show
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - python -m pip check
      - python -m pip show cursor
      - cursor_hide
      - cursor_show

about:
  summary: A small Python package to hide or show the terminal cursor
  homepage: https://github.com/GijsTimmers/cursor
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - duncanmmacleod
