{% set name = "cursor" %}
{% set version = "1.3.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ff3586de5a8e9367b689b31092d3f681b03efc92fdcf10aea538778e80f9b67a

build:
  entry_points:
    - cursor_hide = cursor:hide
    - cursor_show = cursor:show
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=2.7
    - setuptools
  run:
    - python >=2.7

test:
  requires:
    - pip
  commands:
    # check requirements
    - python -m pip check
    # check entry points
    - cursor_hide
    - cursor_show

about:
  home: https://github.com/GijsTimmers/cursor
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: A small Python package to hide or show the terminal cursor

extra:
  recipe-maintainers:
    - duncanmmacleod
